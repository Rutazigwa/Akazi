# Production stack for a Rwanda-hosted VPS (residency option 1).
#
# Deploy this on a Rwandan or regionally-hosted server. Do NOT point the app at
# a managed database in a foreign region -- see CLAUDE.md section 4. The app
# refuses to start unless DATA_RESIDENCY is set, and setting it to something
# untrue is a decision someone has to make on purpose.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Postgres is NOT published to the host. It is reachable only on the internal
# network, so the database is not exposed to the internet even by accident.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-akazi}
      # Encryption at rest is a Law 058/2021 requirement and is provided by the
      # host: put /var/lib/docker/volumes on a LUKS-encrypted disk. See
      # docs/DEPLOYMENT.md -- this line is a reminder, not the mechanism.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-akazi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-akazi}
      DATA_RESIDENCY: ${DATA_RESIDENCY:?state the residency posture explicitly}
      NCSA_CERTIFICATE_REF: ${NCSA_CERTIFICATE_REF:-}
      DEBUG: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal, web]

  # Caddy terminates TLS and obtains certificates automatically. Bearer tokens
  # over plaintext HTTP are simply readable, so there is no non-TLS deployment
  # of this system that is acceptable.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set to the public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # The database sits here and nowhere else -- unreachable from the internet.
  internal:
    internal: true
  web:
