# Self-hosted Postgres, per residency option 1 (recommended for the pilot).
# Deploy this on a Rwandan or regionally-hosted VPS -- not on a managed cloud
# database in a foreign region. See CLAUDE.md section 4.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: placement
      POSTGRES_PASSWORD: placement
      POSTGRES_DB: placement_ops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement -d placement_ops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
