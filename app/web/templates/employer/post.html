{% extends "employer/base.html" %}
{% block title %}Post a shift · Akazi{% endblock %}
{% block body %}
<h1>Post a shift</h1>
<div class="card">
  <form method="post" action="/employer/post">
    <input type="hidden" name="csrf_token" value="{{ employer.csrf_token }}">
    <div class="grid">
      <div><label for="title">Role</label><input id="title" name="title" required placeholder="Morning cleaner"></div>
      <div>
        <label for="work_type">Type</label>
        <select id="work_type" name="work_type">
          <option value="shift">Shift</option><option value="internship">Internship</option>
          <option value="apprenticeship">Apprenticeship</option>
          <option value="fixed_term">Fixed term</option><option value="project">Project</option>
        </select>
      </div>
      <div><label for="headcount">How many people</label><input id="headcount" name="headcount" type="number" min="1" value="1" required></div>
      <div><label for="starts_on">Date</label><input id="starts_on" name="starts_on" type="date" value="{{ today }}" required></div>
      <div><label for="shift_start">From</label><input id="shift_start" name="shift_start" type="time"></div>
      <div><label for="shift_end">Until</label><input id="shift_end" name="shift_end" type="time"></div>
      <div><label for="pay_rwf">Pay (RWF)</label><input id="pay_rwf" name="pay_rwf" type="number" min="1" required></div>
      <div>
        <label for="pay_unit">Per</label>
        <select id="pay_unit" name="pay_unit">
          <option value="day">Day</option><option value="hour">Hour</option>
          <option value="month">Month</option><option value="task">Task</option>
        </select>
      </div>
      <div>
        <label for="transport_covered">Do you cover transport?</label>
        <select id="transport_covered" name="transport_covered">
          <option value="false">No</option><option value="true">Yes</option>
        </select>
      </div>
      <div>
        <label for="meals_provided">Meals provided?</label>
        <select id="meals_provided" name="meals_provided">
          <option value="false">No</option><option value="true">Yes</option>
        </select>
      </div>
    </div>
    <p class="small muted">
      Covering transport widens who can afford to take the work. A role paying
      RWF 3,000 a day that costs RWF 1,600 in moto fare rarely lasts past week two.
    </p>
    <label for="safety_notes">Anything about the site we should tell people</label>
    <input id="safety_notes" name="safety_notes">
    <p><button>Post the shift</button></p>
  </form>
</div>
{% endblock %}
