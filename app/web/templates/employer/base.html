<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Akazi{% endblock %}</title>
<link rel="stylesheet" href="/static/akazi.css">
</head>
<body class="employer">
{% if employer %}
<header>
  <span class="brand">Akazi</span>
  <a href="/employer/" class="{{ 'on' if nav=='home' }}">Shifts</a>
  <a href="/employer/post" class="{{ 'on' if nav=='post' }}">Post a shift</a>
  <span class="spacer"></span>
  <span class="small dim-header">{{ employer.business_name }} · {{ employer.full_name }}</span>
  <form class="inline" method="post" action="/employer/logout">
    <input type="hidden" name="csrf_token" value="{{ employer.csrf_token }}">
    <button class="secondary compact">Sign out</button>
  </form>
</header>
{% endif %}
<main>
  {% if flash %}<div class="flash {{ flash_kind or 'ok' }}">{{ flash }}</div>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
