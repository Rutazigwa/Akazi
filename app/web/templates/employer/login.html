{% extends "employer/base.html" %}
{% block title %}Sign in · Akazi{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:3rem auto;">
  <h1>Akazi</h1>
  <p class="muted small">Sign in to see your shifts and confirm attendance.</p>
  <form method="post" action="/employer/login">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
