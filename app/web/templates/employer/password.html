{% extends "employer/base.html" %}
{% block title %}Change your password · Akazi{% endblock %}
{% block body %}
<div class="card" style="max-width:420px;margin:2rem auto;">
  <h1>Choose a password</h1>
  <p class="muted small">
    The password you signed in with was issued to you by Akazi, so we know it
    too. Please replace it before going further.
  </p>
  <form method="post" action="/employer/password">
    <input type="hidden" name="csrf_token" value="{{ employer.csrf_token }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password"
           autocomplete="current-password" required autofocus>
    <label for="new_password">New password</label>
    <input id="new_password" name="new_password" type="password"
           autocomplete="new-password" minlength="12" required>
    <p class="small muted">At least 12 characters.</p>
    <p><button style="width:100%">Change it</button></p>
  </form>
</div>
{% endblock %}
