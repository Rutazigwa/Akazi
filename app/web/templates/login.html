{% extends "base.html" %}
{% block title %}Sign in · Akazi{% endblock %}
{% block body %}
<div class="card" style="max-width: 380px; margin: 3rem auto;">
  <h1>Akazi</h1>
  <p class="muted small">Internal operations. Coordinators and owner only.</p>
  <form method="post" action="/ui/login">
    <input type="hidden" name="next" value="{{ next or '' }}">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button style="width:100%">Sign in</button></p>
  </form>
</div>
{% endblock %}
