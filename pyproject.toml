[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-ops"
version = "0.1.0"
description = "Internal admin system for a demand-led youth placement operator in Rwanda"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.28"]

# Without this, setuptools cannot tell which top-level directories are the
# package: app/, tests/, migrations/ and scripts/ all sit at the root, and
# auto-discovery refuses to guess.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
