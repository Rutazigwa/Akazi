name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite creates a throwaway database per run and applies every
      # migration to it, so CI also proves the migrations build from empty.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      DATA_RESIDENCY: local_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pyflakes

      - name: Lint
        run: python -m pyflakes app/ tests/ scripts/

      - name: Migrations apply to an empty database
        env:
          PGPASSWORD: postgres
        run: ./scripts/migrate.sh "postgresql://postgres:postgres@localhost:5432/postgres"

      - name: Tests
        run: python -m pytest -q
